<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link id="manifest-link" rel="manifest" href="/manifest.json" />
    <script>
      (function() {
        const savedTheme = localStorage.getItem('ufstats_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        const manifestEl = document.getElementById('manifest-link');
        if (manifestEl) {
          manifestEl.setAttribute('href', savedTheme === 'dark' ? '/manifest_dark.json' : '/manifest.json');
        }
      })();
    </script>
    <meta name="theme-color" content="#080c14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Sideline intelligence for elite Ultimate Frisbee. Track Grass, Beach, and Indoor games with 100% offline reliability. Built by coaches, for coaches." />
    <meta property="og:title" content="ustats.pro — Sideline Intelligence for Elite Ultimate" />
    <meta property="og:description" content="Track games with 100% offline reliability. Real-time NIS analytics, implicit flow tracking, and smart-sync. No app store required." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ustats.pro" />
    <meta property="og:image" content="https://ustats.pro/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>ustats.pro — Sideline Intelligence for Elite Ultimate</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
