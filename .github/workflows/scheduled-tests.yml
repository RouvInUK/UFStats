name: Scheduled Automated Test Suite

on:
  schedule:
    # Runs at 07:00 UTC every Monday, Wednesday, and Friday
    - cron: '0 7 * * 1,3,5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Setup Environment Variables
        run: |
          echo "VITE_TEST_USER_PASSWORD=${{ secrets.VITE_TEST_USER_PASSWORD }}" >> .env.local
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env.local
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.local

      - name: Run Playwright Tests (Serial Mode)
        run: npx playwright test --workers=1

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
